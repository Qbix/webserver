name: Build Static Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      php_version:
        description: 'PHP version to build'
        default: '8.3'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            spc_os: linux
            spc_arch: x86_64
            extensions: "pcntl,sockets,pdo_sqlite,sqlite3,openssl,mbstring,phar,tokenizer,filter,ctype,posix,session,gd"
          - os: ubuntu-24.04-arm
            name: linux-aarch64
            spc_os: linux
            spc_arch: aarch64
            extensions: "pcntl,sockets,pdo_sqlite,sqlite3,openssl,mbstring,phar,tokenizer,filter,ctype,posix,session,gd"
          - os: macos-latest
            name: macos-arm64
            spc_os: macos
            spc_arch: aarch64
            extensions: "pcntl,sockets,pdo_sqlite,sqlite3,openssl,mbstring,phar,tokenizer,filter,ctype,posix,session,gd"
          - os: windows-latest
            name: windows-x64
            spc_os: windows
            spc_arch: x64
            # No pcntl or posix on Windows
            extensions: "sockets,pdo_sqlite,sqlite3,openssl,mbstring,phar,tokenizer,filter,ctype,session,gd"

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      # ── Unix build dependencies ──────────────────────────
      - name: Install system build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential cmake autoconf automake libtool \
            pkg-config pkgconf bison re2c curl wget \
            musl-tools musl-dev

      - name: Install system build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake autoconf automake libtool pkg-config bison re2c

      # ── Download spc binary ──────────────────────────────
      - name: Download spc (Unix)
        if: runner.os != 'Windows'
        run: |
          SPC_URL="https://dl.static-php.dev/static-php-cli/spc-bin/nightly/spc-${{ matrix.spc_os }}-${{ matrix.spc_arch }}"
          echo "Downloading: $SPC_URL"
          for i in 1 2 3; do
            curl -fSL --retry 3 --retry-delay 5 "$SPC_URL" -o spc && break
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          if [ ! -f spc ]; then
            echo "Self-hosted download failed, trying GitHub release..."
            curl -fSL "https://github.com/crazywhalecc/static-php-cli/releases/latest/download/spc-${{ matrix.spc_os }}-${{ matrix.spc_arch }}" -o spc
          fi
          chmod +x spc
          ./spc --version

      - name: Setup spc from source (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The nightly spc binary has Windows extraction bugs.
          # Clone from source and run with the runner's PHP instead.
          git clone --depth 1 https://github.com/crazywhalecc/static-php-cli.git spc-src
          cd spc-src
          php -v
          composer install --no-dev --no-interaction --quiet 2>&1
          php bin/spc --version

      # ── Unix-only setup steps ────────────────────────────
      - name: Make pkg-config findable everywhere
        if: runner.os != 'Windows'
        run: |
          PKG_REAL=""
          for p in /usr/bin/pkg-config /opt/homebrew/bin/pkg-config /usr/local/bin/pkg-config; do
            if [ -x "$p" ]; then PKG_REAL="$p"; break; fi
          done
          if [ -z "$PKG_REAL" ] && command -v pkgconf &>/dev/null; then
            PKG_REAL="$(which pkgconf)"
          fi
          if [ -n "$PKG_REAL" ]; then
            echo "Found pkg-config at: $PKG_REAL"
            for dest in /usr/local/bin /usr/local/musl/bin /usr/bin; do
              sudo mkdir -p "$dest" 2>/dev/null || true
              sudo cp -f "$PKG_REAL" "$dest/pkg-config" 2>/dev/null || true
            done
          fi

      - name: Setup musl cross-compiler wrappers (Linux only)
        if: runner.os == 'Linux'
        run: |
          ARCH=$(uname -m)
          MUSL_PREFIX="${ARCH}-linux-musl"
          if ! command -v ${MUSL_PREFIX}-gcc &>/dev/null; then
            echo "Creating ${MUSL_PREFIX} toolchain wrappers..."
            sudo mkdir -p /usr/local/musl/bin /usr/local/musl/${MUSL_PREFIX}/bin
            for tool in gcc g++; do
              SRC=$(which musl-$tool 2>/dev/null || which musl-gcc 2>/dev/null)
              if [ -n "$SRC" ]; then
                sudo cp -f "$SRC" "/usr/local/musl/bin/${MUSL_PREFIX}-${tool}"
                sudo cp -f "$SRC" "/usr/local/musl/${MUSL_PREFIX}/bin/${MUSL_PREFIX}-${tool}"
              fi
            done
            for tool in ar ld nm objcopy objdump ranlib readelf strip; do
              SRC=$(which $tool 2>/dev/null)
              if [ -n "$SRC" ]; then
                sudo cp -f "$SRC" "/usr/local/musl/bin/${MUSL_PREFIX}-${tool}"
                sudo cp -f "$SRC" "/usr/local/musl/${MUSL_PREFIX}/bin/${MUSL_PREFIX}-${tool}"
              fi
            done
          fi

      - name: Setup MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Run spc doctor (Unix, best-effort)
        if: runner.os != 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./spc doctor --auto-fix 2>&1 || echo "Doctor had issues (continuing)"

      - name: Run spc doctor (Windows, best-effort)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          php spc-src\bin\spc doctor --auto-fix 2>&1

      # ── Download sources ─────────────────────────────────
      - name: Download PHP and extension sources (Unix)
        if: runner.os != 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PHP_VER="${{ github.event.inputs.php_version || '8.3' }}"
          ./spc download \
            --for-extensions="${{ matrix.extensions }}" \
            --with-php=$PHP_VER

      - name: Download PHP and extension sources (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $phpVer = "${{ github.event.inputs.php_version || '8.3' }}"
          # Try with FFI first (needed for COW fork), fall back without it
          $exts = "${{ matrix.extensions }},ffi"
          php spc-src\bin\spc download --for-extensions="$exts" --with-php=$phpVer 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "FFI download failed, building without it (will use php-cgi mode)"
            $exts = "${{ matrix.extensions }}"
            php spc-src\bin\spc download --for-extensions="$exts" --with-php=$phpVer
          }
          # Store which extensions we got
          Set-Content -Path "win_exts.txt" -Value $exts

      # ── Build ────────────────────────────────────────────
      - name: Build static PHP CLI + phpmicro (Unix)
        if: runner.os != 'Windows'
        env:
          SPC_SKIP_DOCTOR_CHECK_ITEMS: "pkg-config,musl-wrapper"
        run: |
          ./spc build "${{ matrix.extensions }}" --build-cli --build-micro --with-libs=libjpeg,libwebp,freetype

      - name: Build static PHP CLI + phpmicro (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $exts = Get-Content "win_exts.txt" -ErrorAction SilentlyContinue
          if (-not $exts) { $exts = "${{ matrix.extensions }}" }
          Write-Host "Building with extensions: $exts"
          php spc-src\bin\spc build "$exts" --build-cli --build-micro --with-libs=libjpeg,libwebp,freetype

      - name: Build qbix_fork.dll (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          # cl.exe is on PATH from ilammy/msvc-dev-cmd
          Write-Host "Compiling qbix_fork.dll..."
          cl /LD /O2 src\fork_shim.c /Fe:qbix_fork.dll
          if (Test-Path qbix_fork.dll) {
            Write-Host "Built qbix_fork.dll: $((Get-Item qbix_fork.dll).Length) bytes"
          } else {
            Write-Host "qbix_fork.dll build failed (Windows COW fork unavailable, php-cgi fallback)"
          }

      # ── Package ──────────────────────────────────────────
      - name: Build phar and combine (Unix)
        if: runner.os != 'Windows'
        run: |
          ./buildroot/bin/php -d phar.readonly=0 build-phar.php
          ./spc micro:combine bin/qbixserver.phar -O qbixserver-${{ matrix.name }}
          chmod +x qbixserver-${{ matrix.name }}
          ls -lh qbixserver-${{ matrix.name }}
          cp buildroot/bin/php php-${{ matrix.name }}
          chmod +x php-${{ matrix.name }}

      - name: Build phar and combine (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          if (-not (Test-Path "spc-src\buildroot\bin\php.exe")) {
            Write-Host "PHP build did not produce a binary — skipping package step"
            exit 0
          }
          .\spc-src\buildroot\bin\php.exe -d phar.readonly=0 build-phar.php
          php spc-src\bin\spc micro:combine bin\qbixserver.phar -O qbixserver-${{ matrix.name }}.exe
          Get-Item qbixserver-${{ matrix.name }}.exe | Select-Object Name, Length
          Copy-Item spc-src\buildroot\bin\php.exe php-${{ matrix.name }}.exe
          if (Test-Path qbix_fork.dll) {
            Write-Host "Including qbix_fork.dll in artifacts"
          }

      # ── Compress ─────────────────────────────────────────
      # NOTE: Do NOT UPX-pack the combined binary. `spc micro:combine`
      # appends the phar as an ELF overlay which phpmicro locates by
      # reading its own file at runtime; UPX rewrites the ELF and drops
      # that overlay, so the binary starts and tries to parse its own
      # compressed image as PHP (syntax error, unexpected token "!").

      # ── Smoke test ───────────────────────────────────────
      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: |
          set -o pipefail
          out=$(./qbixserver-${{ matrix.name }} --help 2>&1)
          echo "$out" | head -5
          case "$out" in
            *"Parse error"*|*"Fatal error"*) echo "::error::binary is corrupt"; exit 1 ;;
          esac

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          if (Test-Path "qbixserver-${{ matrix.name }}.exe") {
            .\qbixserver-${{ matrix.name }}.exe --help 2>&1 | Select-Object -First 5
          } else {
            Write-Host "Binary not built — skipping smoke test"
          }

      # ── Upload ───────────────────────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qbixserver-${{ matrix.name }}
          path: |
            qbixserver-${{ matrix.name }}*
            php-${{ matrix.name }}*
            qbix_fork.dll

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v1.3.0 – Boldly Go"
          body_path: RELEASE_NOTES.md
          draft: false
          generate_release_notes: false
          fail_on_unmatched_files: false
          files: |
            artifacts/qbixserver-linux-x86_64/qbixserver-linux-x86_64
            artifacts/qbixserver-linux-aarch64/qbixserver-linux-aarch64
            artifacts/qbixserver-macos-arm64/qbixserver-macos-arm64
            artifacts/qbixserver-windows-x64/qbixserver-windows-x64.exe
            artifacts/qbixserver-windows-x64/qbix_fork.dll
            artifacts/qbixserver-linux-x86_64/php-linux-x86_64
            artifacts/qbixserver-linux-aarch64/php-linux-aarch64
            artifacts/qbixserver-macos-arm64/php-macos-arm64
            artifacts/qbixserver-windows-x64/php-windows-x64.exe
