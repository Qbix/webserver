<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Live Counter — Qbix Server</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;overflow:hidden}
.card{text-align:center;padding:60px 40px;max-width:420px;position:relative;z-index:1}
.label{font-size:13px;text-transform:uppercase;letter-spacing:3px;opacity:.65;margin-bottom:20px}
.count{font-size:128px;font-weight:800;line-height:1;margin-bottom:10px;font-variant-numeric:tabular-nums;transition:transform .15s}
.count.bump{transform:scale(1.08)}
.sublabel{font-size:15px;opacity:.5;margin-bottom:48px}
.viewers-section{margin-bottom:36px}
.viewers-section .v-label{font-size:11px;text-transform:uppercase;letter-spacing:2px;opacity:.5;margin-bottom:10px}
.viewers{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:28px}
.viewers .dot{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.5);animation:popIn .3s ease;transition:background .3s}
.viewers .dot.you{background:rgba(255,255,255,.95);box-shadow:0 0 8px rgba(255,255,255,.5)}
.stats{display:flex;gap:24px;justify-content:center;margin-bottom:36px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .s-val{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .s-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;opacity:.4}
.meta{font-size:11px;opacity:.3;line-height:1.8}
.meta a{color:#fff}
.bg-dots{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg-dots .bg-dot{position:absolute;width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.1);animation:float 8s ease-in-out infinite}
@keyframes popIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-30px)}}
@media(max-width:500px){.count{font-size:80px}.card{padding:40px 20px}}
</style>
</head>
<body>

<div class="bg-dots" id="bg-dots"></div>

<div class="card">
  <div class="label">Page Views</div>
  <div class="count" id="count">0</div>
  <div class="sublabel">since server started</div>

  <div class="viewers-section">
    <div class="v-label">Connected Viewers</div>
    <div class="viewers" id="viewers"></div>
  </div>

  <div class="stats">
    <div class="stat"><span class="s-val" id="rps">0</span><span class="s-label">req/sec</span></div>
    <div class="stat"><span class="s-val" id="uptime">0s</span><span class="s-label">uptime</span></div>
    <div class="stat"><span class="s-val" id="conns">0</span><span class="s-label">viewers</span></div>
  </div>

  <div class="meta">
    Powered by <a href="https://github.com/Qbix/webserver">Qbix Server</a><br>
    Real-time updates via WebSocket heartbeat
  </div>
</div>

<script>
const countEl = document.getElementById('count');
let lastCount = 0;

// Generate background dots
const bgDots = document.getElementById('bg-dots');
for (let i = 0; i < 30; i++) {
  const dot = document.createElement('div');
  dot.className = 'bg-dot';
  dot.style.left = Math.random()*100+'%';
  dot.style.top = Math.random()*100+'%';
  dot.style.animationDelay = Math.random()*8+'s';
  dot.style.animationDuration = (6+Math.random()*6)+'s';
  bgDots.appendChild(dot);
}

// Increment page view
fetch('/count.php', {method:'POST'})
  .then(r => r.json())
  .then(d => setCount(d.count))
  .catch(() => {});

// WebSocket for live updates
const proto = location.protocol==='https:'?'wss:':'ws:';
const ws = new WebSocket(proto+'//'+location.host+'/Q/ws');
ws.onmessage = e => {
  try {
    const msg = JSON.parse(e.data);
    if (msg.type === 'heartbeat') {
      setCount(msg.stats.requests);
      setViewers(msg.stats.currentConnections || 1);
      document.getElementById('rps').textContent = (msg.stats.rps || 0).toFixed(1);
      document.getElementById('uptime').textContent = msg.stats.uptime || '0s';
      document.getElementById('conns').textContent = msg.stats.currentConnections || 1;
    }
  } catch(e) {}
};
ws.onclose = () => setTimeout(() => location.reload(), 5000);

function setCount(n) {
  if (n === lastCount) return;
  lastCount = n;
  countEl.textContent = n.toLocaleString();
  countEl.classList.add('bump');
  setTimeout(() => countEl.classList.remove('bump'), 150);
}

function setViewers(n) {
  const el = document.getElementById('viewers');
  let html = '';
  for (let i = 0; i < Math.min(n, 24); i++) {
    html += '<div class="dot'+(i===0?' you':'')+'" style="animation-delay:'+(i*40)+'ms"></div>';
  }
  if (n > 24) html += '<span style="font-size:12px;opacity:.5;align-self:center">+' + (n-24) + '</span>';
  el.innerHTML = html;
}
</script>
</body>
</html>
