<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Swarm — Qbix Server</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f172a;--surface:#1e293b;--surface2:#334155;--border:#475569;--text:#e2e8f0;--muted:#94a3b8;--dim:#64748b;--accent:#06b6d4;--green:#4ade80;--red:#f87171;--purple:#a78bfa;--radius:10px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.topbar{padding:10px 20px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:10px;flex-shrink:0}
.topbar img{width:20px;height:20px}
.topbar h1{font-size:15px;font-weight:600;flex:1}
.topbar .badge{font-size:9px;font-weight:700;padding:2px 8px;border-radius:12px;letter-spacing:.5px}
.topbar .badge.node{background:var(--accent);color:#000}
.topbar .badge.peers{background:var(--surface2);color:var(--muted)}
.topbar .name-area input{background:var(--surface);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:4px 8px;color:var(--text);font-size:12px;width:100px;outline:none}
.layout{display:flex;flex:1;overflow:hidden}
.panel{flex:1;display:flex;flex-direction:column;overflow:hidden}
.panel+.panel{border-left:1px solid rgba(255,255,255,.06)}
.panel-header{padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.06);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);display:flex;align-items:center;gap:8px}
.panel-header .ph-count{margin-left:auto;background:rgba(255,255,255,.06);padding:1px 6px;border-radius:8px;font-size:10px}
.tasks-area{flex:1;overflow-y:auto;padding:12px}
.add-form{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.06)}
.add-form input{flex:1;background:var(--surface);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:8px 12px;color:var(--text);font-size:13px;outline:none}
.add-form input:focus{border-color:var(--accent)}
.add-form button{background:var(--accent);color:#000;border:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.task{background:var(--surface);border:1px solid rgba(255,255,255,.05);border-radius:8px;padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;gap:10px;animation:slideIn .2s ease}
.task.done{opacity:.4}
.task.done .t-text{text-decoration:line-through}
.task .t-check{width:16px;height:16px;border:2px solid var(--border);border-radius:50%;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
.task .t-check:hover{border-color:var(--accent)}
.task.done .t-check{background:var(--green);border-color:var(--green)}
.task.done .t-check::after{content:"✓";color:#000;font-size:10px;font-weight:700}
.task .t-text{flex:1;font-size:13px}
.task .t-del{color:var(--dim);cursor:pointer;opacity:0;transition:opacity .15s;font-size:14px}
.task:hover .t-del{opacity:1}
.task .t-del:hover{color:var(--red)}
.chat-messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:4px}
.chat-msg{animation:slideIn .15s ease}
.chat-msg .cm-header{display:flex;align-items:baseline;gap:6px;margin-bottom:1px}
.chat-msg .cm-name{font-size:12px;font-weight:600}
.chat-msg .cm-server{font-size:9px;color:var(--dim);background:rgba(255,255,255,.04);padding:0 4px;border-radius:3px}
.chat-msg .cm-time{font-size:9px;color:var(--dim);margin-left:auto}
.chat-msg .cm-text{font-size:13px;line-height:1.4;padding:4px 10px;background:var(--surface);border-radius:8px;display:inline-block;max-width:90%;word-wrap:break-word}
.chat-input{display:flex;gap:6px;padding:8px 12px;border-top:1px solid rgba(255,255,255,.06)}
.chat-input input{flex:1;background:var(--surface);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:8px 12px;color:var(--text);font-size:13px;outline:none}
.chat-input input:focus{border-color:var(--purple)}
.chat-input button{background:var(--purple);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer}
.cluster-info{padding:6px 12px;border-top:1px solid rgba(255,255,255,.06);font-size:10px;color:var(--dim);flex-shrink:0}
.cluster-info .ci-peer{display:inline-flex;align-items:center;gap:3px;margin-right:8px}
.cluster-info .ci-dot{width:5px;height:5px;border-radius:50%;background:var(--green)}
.status-bar{padding:6px 20px;border-top:1px solid rgba(255,255,255,.06);display:flex;gap:16px;font-size:10px;color:var(--dim);flex-shrink:0}
.status-bar .s-dot{width:5px;height:5px;border-radius:50%;display:inline-block;margin-right:3px;background:var(--green)}
.empty{text-align:center;padding:30px;color:var(--dim);font-size:12px}
@keyframes slideIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:700px){.layout{flex-direction:column}.panel+.panel{border-left:none;border-top:1px solid rgba(255,255,255,.06)}}
</style>
</head>
<body>
<div class="topbar">
  <img src="/favicon.svg" alt="">
  <h1>Swarm</h1>
  <div class="name-area"><input id="my-name" type="text" placeholder="Your name" maxlength="15"></div>
  <span class="badge node" id="node-badge">:?</span>
  <span class="badge peers" id="peers-badge">0 peers</span>
</div>
<div class="layout">
  <div class="panel">
    <div class="panel-header">📋 Tasks<span class="ph-count" id="task-count">0</span></div>
    <div class="add-form"><input id="new-task" type="text" placeholder="Add task..." maxlength="200"><button onclick="addTask()">Add</button></div>
    <div class="tasks-area" id="tasks"></div>
  </div>
  <div class="panel">
    <div class="panel-header">💬 Chat<span class="ph-count" id="msg-count">0</span></div>
    <div class="chat-messages" id="messages"></div>
    <div class="chat-input"><input id="chat-input" type="text" placeholder="Type a message..." maxlength="500"><button onclick="sendChat()">Send</button></div>
  </div>
</div>
<div class="cluster-info" id="cluster-info">No peers — start another server with PEERS= env var</div>
<div class="status-bar">
  <span><span class="s-dot"></span><span id="self-url">...</span></span>
  <span>Tasks: <span id="s-tasks">0</span></span>
  <span>Messages: <span id="s-msgs">0</span></span>
  <span id="s-time">—</span>
</div>
<script>
const API='/api.php';
const COLORS=['#06b6d4','#f97316','#a78bfa','#f43f5e','#22c55e','#eab308','#ec4899','#3b82f6'];
let myName=localStorage.getItem('swarm-name')||'';
document.getElementById('my-name').value=myName;
document.getElementById('my-name').addEventListener('change',e=>{myName=e.target.value.trim();localStorage.setItem('swarm-name',myName);});
function colorFor(n){let h=0;for(let i=0;i<n.length;i++)h=n.charCodeAt(i)+((h<<5)-h);return COLORS[Math.abs(h)%COLORS.length];}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function timeStr(t){if(!t)return'';try{const d=new Date(t.replace(' ','T')+'Z');return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}catch{return'';}}
async function loadAll(){
  const[tasks,msgs,peers]=await Promise.all([
    fetch(API).then(r=>r.json()).catch(()=>[]),
    fetch(API+'?action=messages').then(r=>r.json()).catch(()=>[]),
    fetch(API+'?action=peers').then(r=>r.json()).catch(()=>({peers:[],self:''})),
  ]);
  renderTasks(tasks);renderMessages(msgs);renderCluster(peers);
  document.getElementById('s-tasks').textContent=tasks.length;
  document.getElementById('s-msgs').textContent=msgs.length;
  document.getElementById('s-time').textContent='Updated '+new Date().toLocaleTimeString();
}
function renderTasks(tasks){
  const el=document.getElementById('tasks');
  document.getElementById('task-count').textContent=tasks.length;
  if(!tasks.length){el.innerHTML='<div class="empty">No tasks yet. Add one above.</div>';return;}
  el.innerHTML=tasks.map(t=>'<div class="task'+(t.done?' done':'')+'"><div class="t-check" onclick="toggleTask(\''+t.uuid+'\','+(t.done?0:1)+')"></div><span class="t-text">'+esc(t.text)+'</span><span class="t-del" onclick="delTask(\''+t.uuid+'\')">×</span></div>').join('');
}
function renderMessages(msgs){
  const el=document.getElementById('messages');
  document.getElementById('msg-count').textContent=msgs.length;
  if(!msgs.length){el.innerHTML='<div class="empty">No messages yet. Say something.</div>';return;}
  const wasAtBottom=el.scrollHeight-el.scrollTop-el.clientHeight<40;
  el.innerHTML=msgs.map(m=>{
    const color=colorFor(m.name);
    const port=m.server?(m.server.match(/:(\d+)$/)||[,''])[1]:'';
    return'<div class="chat-msg"><div class="cm-header"><span class="cm-name" style="color:'+color+'">'+esc(m.name)+'</span>'+(port?'<span class="cm-server">:'+port+'</span>':'')+'<span class="cm-time">'+timeStr(m.created_at)+'</span></div><div class="cm-text">'+esc(m.text)+'</div></div>';
  }).join('');
  if(wasAtBottom)el.scrollTop=el.scrollHeight;
}
function renderCluster(data){
  document.getElementById('self-url').textContent=data.self||location.origin;
  const port=(data.self||'').match(/:(\d+)$/);
  document.getElementById('node-badge').textContent=':'+(port?port[1]:'?');
  document.getElementById('peers-badge').textContent=(data.peers?.length||0)+' peers';
  const el=document.getElementById('cluster-info');
  if(!data.peers?.length){el.innerHTML='Standalone — start another server with PEERS= env var';return;}
  el.innerHTML='Cluster: '+data.peers.map(p=>'<span class="ci-peer"><span class="ci-dot"></span>'+esc(p)+'</span>').join('');
}
async function addTask(){const i=document.getElementById('new-task');const t=i.value.trim();if(!t)return;i.value='';await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t})});loadAll();}
async function toggleTask(u,d){await fetch(API,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({uuid:u,done:d})});loadAll();}
async function delTask(u){await fetch(API,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({uuid:u})});loadAll();}
async function sendChat(){const i=document.getElementById('chat-input');const t=i.value.trim();const n=myName||'anon';if(!t)return;i.value='';await fetch(API+'?action=message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,text:t})});loadAll();}
document.getElementById('new-task').addEventListener('keydown',e=>{if(e.key==='Enter')addTask();});
document.getElementById('chat-input').addEventListener('keydown',e=>{if(e.key==='Enter')sendChat();});
loadAll();setInterval(loadAll,2000);
</script>
</body>
</html>
