<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat — Qbix Server</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f0f0f;--surface:#1a1a1a;--surface2:#222;--border:#2a2a2a;--text:#e0e0e0;--muted:#777;--dim:#555;--accent:#7c3aed;--accent2:#a78bfa;--green:#4ade80;--blue:#60a5fa;--orange:#fb923c;--red:#f87171;--self-bg:#2d1b69;--other-bg:#262626;--radius:12px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;overflow:hidden}
.sidebar{width:260px;border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-header{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sidebar-header h2{font-size:15px;font-weight:600}
.sidebar-header .logo{width:28px;height:28px}
.room-list{flex:1;overflow-y:auto;padding:8px}
.room{padding:10px 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:10px;margin-bottom:2px;transition:background .15s}
.room:hover{background:var(--surface2)}
.room.active{background:var(--accent);color:#fff}
.room .room-icon{font-size:18px}
.room .room-name{font-size:13px;font-weight:500;flex:1}
.room .room-badge{background:var(--accent);color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;font-weight:700}
.room.active .room-badge{background:rgba(255,255,255,.3)}
.user-bar{padding:12px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px}
.user-bar .avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.user-bar .uname{font-size:13px;font-weight:500;flex:1}
.user-bar .status{width:8px;height:8px;border-radius:50%;background:var(--green)}
.main{flex:1;display:flex;flex-direction:column}
.channel-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.channel-header h3{font-size:15px;font-weight:600;flex:1}
.channel-header .members{display:flex;gap:-4px}
.channel-header .members .m-dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;margin-left:-6px;border:2px solid var(--bg)}
.messages{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:2px}
.msg-group{display:flex;gap:10px;margin-top:12px}
.msg-group .msg-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;margin-top:2px}
.msg-group .msg-content{flex:1;min-width:0}
.msg-group .msg-header{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.msg-group .msg-name{font-size:13px;font-weight:600}
.msg-group .msg-time{font-size:10px;color:var(--dim)}
.msg-bubble{font-size:14px;line-height:1.55;padding:2px 0;word-wrap:break-word}
.msg-bubble .reactions{display:flex;gap:4px;margin-top:4px}
.msg-bubble .reaction{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:1px 6px;font-size:12px;cursor:pointer;transition:background .15s}
.msg-bubble .reaction:hover{background:var(--border)}
.msg-bubble .reaction.mine{border-color:var(--accent);background:rgba(124,58,237,.15)}
.typing-area{padding:6px 20px 4px;min-height:20px}
.typing-text{font-size:11px;color:var(--dim);font-style:italic}
.typing-text .dot-anim{display:inline-block;animation:dotPulse 1.4s infinite}
.typing-text .dot-anim:nth-child(2){animation-delay:.2s}
.typing-text .dot-anim:nth-child(3){animation-delay:.4s}
.input-area{padding:8px 20px 16px;display:flex;gap:10px;align-items:flex-end}
.input-area .msg-box{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;color:var(--text);font-size:14px;outline:none;resize:none;font-family:inherit;line-height:1.4;max-height:120px;transition:border-color .2s}
.input-area .msg-box:focus{border-color:var(--accent2)}
.input-area .send-btn{background:var(--accent);color:#fff;border:none;border-radius:var(--radius);width:40px;height:40px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity .15s;flex-shrink:0}
.input-area .send-btn:hover{opacity:.85}
.input-area .send-btn svg{width:18px;height:18px}
.read-receipt{font-size:10px;color:var(--dim);text-align:right;padding:2px 0}
.read-receipt.read{color:var(--blue)}
.presence-list{padding:8px 12px}
.presence-list .p-title{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin-bottom:8px;padding:0 4px}
.presence-list .p-user{display:flex;align-items:center;gap:8px;padding:4px;font-size:12px;color:var(--muted)}
.presence-list .p-dot{width:6px;height:6px;border-radius:50%}
.presence-list .p-dot.online{background:var(--green)}
.presence-list .p-dot.idle{background:var(--orange)}
.join-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(8px)}
.join-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px;max-width:380px;width:90%;text-align:center}
.join-card h2{font-size:22px;margin-bottom:6px}
.join-card p{color:var(--muted);font-size:13px;margin-bottom:24px}
.join-card input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:11px 14px;color:var(--text);font-size:14px;outline:none;margin-bottom:12px;text-align:center}
.join-card input:focus{border-color:var(--accent2)}
.join-card button{width:100%;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);padding:11px;font-size:14px;font-weight:600;cursor:pointer}
.hidden{display:none!important}
@keyframes dotPulse{0%,60%,100%{opacity:.3}30%{opacity:1}}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:700px){.sidebar{display:none}.main{width:100%}}
</style>
</head>
<body>

<div id="join-overlay" class="join-overlay">
  <div class="join-card">
    <h2>💬 Chat</h2>
    <p>Pick a name and join the conversation</p>
    <input id="name-input" type="text" placeholder="Your name" maxlength="20" autofocus>
    <button onclick="joinChat()">Join Chat</button>
  </div>
</div>

<div class="sidebar">
  <div class="sidebar-header">
    <img class="logo" src="/favicon.svg" alt="">
    <h2>Qbix Chat</h2>
  </div>
  <div class="room-list">
    <div class="room active" data-room="general" onclick="switchRoom('general')">
      <span class="room-icon">#</span>
      <span class="room-name">general</span>
    </div>
    <div class="room" data-room="random" onclick="switchRoom('random')">
      <span class="room-icon">#</span>
      <span class="room-name">random</span>
    </div>
    <div class="room" data-room="dev" onclick="switchRoom('dev')">
      <span class="room-icon">#</span>
      <span class="room-name">dev</span>
    </div>
  </div>
  <div class="presence-list" id="presence">
    <div class="p-title">Online — <span id="online-count">0</span></div>
  </div>
  <div class="user-bar">
    <div class="avatar" id="my-avatar" style="background:var(--accent)">?</div>
    <span class="uname" id="my-name">...</span>
    <div class="status"></div>
  </div>
</div>

<div class="main">
  <div class="channel-header">
    <span style="color:var(--muted);font-size:18px">#</span>
    <h3 id="channel-name">general</h3>
    <div class="members" id="member-dots"></div>
  </div>
  <div class="messages" id="messages"></div>
  <div class="typing-area" id="typing-area"></div>
  <div class="input-area">
    <textarea class="msg-box" id="msg-input" rows="1" placeholder="Type a message..."></textarea>
    <button class="send-btn" onclick="sendMsg()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
</div>

<script>
let ws, me, currentRoom = 'general';
const users = {};
const messages = {};
const typing = {};
const COLORS = ['#7c3aed','#2563eb','#dc2626','#059669','#d97706','#db2777','#7c2d12','#4f46e5'];
let typingTimer = null;
let lastTypingSent = 0;

function colorFor(name) { let h=0; for(let i=0;i<name.length;i++) h=name.charCodeAt(i)+((h<<5)-h); return COLORS[Math.abs(h)%COLORS.length]; }
function initial(name) { return name.charAt(0).toUpperCase(); }
function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function timeStr() { return new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }

function joinChat() {
  me = document.getElementById('name-input').value.trim();
  if (!me) return;
  document.getElementById('join-overlay').classList.add('hidden');
  document.getElementById('my-name').textContent = me;
  const av = document.getElementById('my-avatar');
  av.textContent = initial(me);
  av.style.background = colorFor(me);
  connect();
  document.getElementById('msg-input').focus();
}
document.getElementById('name-input').addEventListener('keydown', e => { if (e.key==='Enter') joinChat(); });

function connect() {
  const proto = location.protocol==='https:'?'wss:':'ws:';
  ws = new WebSocket(proto+'//'+location.host+'/socket.io/?EIO=4&transport=websocket');
  ws.onmessage = e => {
    const s = e.data;
    if (s[0]==='0') ws.send('40');
    else if (s.startsWith('40')) { emit('join', {name:me, room:currentRoom}); }
    else if (s.startsWith('42')) {
      const [event, data] = JSON.parse(s.substring(2));
      handleEvent(event, data);
    }
    else if (s==='2') ws.send('3');
  };
  ws.onclose = () => setTimeout(connect, 2000);
}

function emit(event, data) { if (ws?.readyState===1) ws.send('42'+JSON.stringify([event,data])); }

function handleEvent(event, data) {
  if (event === '_redirect' && data.url) {
    console.log('Redirected to room leader:', data.url);
    ws.close();
    const leaderWs = data.url + '/socket.io/?EIO=4&transport=websocket';
    ws = new WebSocket(leaderWs);
    ws.onmessage = e => {
      const s = e.data;
      if (s[0]==='0') ws.send('40');
      else if (s.startsWith('40')) emit('join', {name:me, room:currentRoom});
      else if (s.startsWith('42')) { const[ev,d]=JSON.parse(s.substring(2)); handleEvent(ev,d); }
      else if (s==='2') ws.send('3');
    };
    ws.onclose = () => setTimeout(connect, 2000);
    return;
  }
  switch(event) {
    case 'message':
      addMessage(data.room||currentRoom, data);
      if (data.name !== me) emit('read', {msgId:data.id, room:data.room||currentRoom});
      break;
    case 'joined':
      users[data.name] = {online:true, color:colorFor(data.name)};
      addSystem(data.room||currentRoom, data.name+' joined');
      updatePresence();
      break;
    case 'left':
      if (users[data.name]) users[data.name].online = false;
      addSystem(data.room||currentRoom, data.name+' left');
      updatePresence();
      break;
    case 'typing':
      if (data.name !== me) showTyping(data.name, data.room||currentRoom);
      break;
    case 'stop_typing':
      hideTyping(data.name);
      break;
    case 'read':
      markRead(data.msgId);
      break;
    case 'reaction':
      addReaction(data.msgId, data.emoji, data.name);
      break;
    case 'presence':
      if (data.users) {
        Object.keys(data.users).forEach(u => { users[u] = {online:true, color:colorFor(u)}; });
        updatePresence();
      }
      break;
  }
}

let msgCounter = 0;
function addMessage(room, data) {
  if (!messages[room]) messages[room] = [];
  const msg = {id: data.id || (++msgCounter), name:data.name, text:data.text, time:data.time||timeStr(), reactions:{}, readBy:[]};
  messages[room].push(msg);
  if (room === currentRoom) renderMessages();
}

function addSystem(room, text) {
  if (!messages[room]) messages[room] = [];
  messages[room].push({system:true, text:text, time:timeStr()});
  if (room === currentRoom) renderMessages();
}

function renderMessages() {
  const el = document.getElementById('messages');
  const msgs = messages[currentRoom] || [];
  let html = '';
  let lastAuthor = '';
  msgs.forEach(m => {
    if (m.system) {
      html += '<div style="text-align:center;color:var(--dim);font-size:12px;padding:8px 0;font-style:italic">'+esc(m.text)+'</div>';
      lastAuthor = '';
      return;
    }
    const isNew = m.name !== lastAuthor;
    const color = colorFor(m.name);
    if (isNew) {
      html += '<div class="msg-group" style="animation:fadeIn .2s ease">';
      html += '<div class="msg-avatar" style="background:'+color+'">'+initial(m.name)+'</div>';
      html += '<div class="msg-content">';
      html += '<div class="msg-header"><span class="msg-name" style="color:'+color+'">'+esc(m.name)+'</span><span class="msg-time">'+m.time+'</span></div>';
    }
    html += '<div class="msg-bubble" data-id="'+m.id+'">'+esc(m.text);
    // Reactions
    const rxns = m.reactions || {};
    const rxnKeys = Object.keys(rxns);
    if (rxnKeys.length) {
      html += '<div class="reactions">';
      rxnKeys.forEach(emoji => {
        const who = rxns[emoji];
        const isMine = who.includes(me);
        html += '<span class="reaction'+(isMine?' mine':'')+'" onclick="react('+m.id+',\''+emoji+'\')">'+emoji+' '+who.length+'</span>';
      });
      html += '</div>';
    }
    html += '</div>';
    // Read receipt for own messages
    if (m.name === me && m.readBy && m.readBy.length > 0) {
      html += '<div class="read-receipt read">✓✓ read by '+m.readBy.join(', ')+'</div>';
    } else if (m.name === me) {
      html += '<div class="read-receipt">✓ sent</div>';
    }
    if (isNew) html += '</div></div>';
    lastAuthor = m.name;
  });
  el.innerHTML = html;
  el.scrollTop = el.scrollHeight;
}

function sendMsg() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text) return;
  const id = ++msgCounter;
  emit('message', {id:id, name:me, text:text, room:currentRoom, time:timeStr()});
  addMessage(currentRoom, {id:id, name:me, text:text, time:timeStr()});
  input.value = '';
  input.style.height = 'auto';
  emit('stop_typing', {name:me, room:currentRoom});
}

// Auto-resize textarea
const msgInput = document.getElementById('msg-input');
msgInput.addEventListener('keydown', e => {
  if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});
msgInput.addEventListener('input', () => {
  msgInput.style.height = 'auto';
  msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
  // Typing indicator — throttle to 1 per 2 seconds
  const now = Date.now();
  if (now - lastTypingSent > 2000) {
    emit('typing', {name:me, room:currentRoom});
    lastTypingSent = now;
  }
  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => emit('stop_typing', {name:me, room:currentRoom}), 3000);
});

function showTyping(name, room) {
  if (room !== currentRoom) return;
  typing[name] = Date.now();
  renderTyping();
  setTimeout(() => { if (Date.now() - typing[name] >= 4000) { delete typing[name]; renderTyping(); } }, 4500);
}
function hideTyping(name) { delete typing[name]; renderTyping(); }
function renderTyping() {
  const names = Object.keys(typing);
  const el = document.getElementById('typing-area');
  if (!names.length) { el.innerHTML = ''; return; }
  const dots = '<span class="dot-anim">.</span><span class="dot-anim">.</span><span class="dot-anim">.</span>';
  if (names.length === 1) el.innerHTML = '<span class="typing-text">'+esc(names[0])+' is typing'+dots+'</span>';
  else if (names.length === 2) el.innerHTML = '<span class="typing-text">'+esc(names[0])+' and '+esc(names[1])+' are typing'+dots+'</span>';
  else el.innerHTML = '<span class="typing-text">Several people are typing'+dots+'</span>';
}

function markRead(msgId) {
  const msgs = messages[currentRoom] || [];
  const msg = msgs.find(m => m.id === msgId);
  if (msg && !msg.readBy) msg.readBy = [];
  if (msg && msg.name === me) { msg.readBy.push('someone'); renderMessages(); }
}

function react(msgId, emoji) {
  emit('reaction', {msgId:msgId, emoji:emoji, name:me, room:currentRoom});
  addReaction(msgId, emoji, me);
}
function addReaction(msgId, emoji, name) {
  const msgs = messages[currentRoom] || [];
  const msg = msgs.find(m => m.id === msgId);
  if (!msg) return;
  if (!msg.reactions) msg.reactions = {};
  if (!msg.reactions[emoji]) msg.reactions[emoji] = [];
  if (!msg.reactions[emoji].includes(name)) msg.reactions[emoji].push(name);
  renderMessages();
}

function switchRoom(room) {
  document.querySelectorAll('.room').forEach(r => r.classList.toggle('active', r.dataset.room===room));
  currentRoom = room;
  document.getElementById('channel-name').textContent = room;
  renderMessages();
  emit('switch', {name:me, room:room});
}

function updatePresence() {
  const el = document.getElementById('presence');
  const online = Object.entries(users).filter(([_,u]) => u.online);
  document.getElementById('online-count').textContent = online.length;
  let html = '<div class="p-title">Online — '+online.length+'</div>';
  online.forEach(([name, u]) => {
    html += '<div class="p-user"><div class="p-dot online"></div>'+esc(name)+'</div>';
  });
  el.innerHTML = html;
  // Member dots in header
  const dots = document.getElementById('member-dots');
  dots.innerHTML = online.slice(0,5).map(([name,u]) =>
    '<div class="m-dot" style="background:'+u.color+'" title="'+esc(name)+'">'+initial(name)+'</div>'
  ).join('') + (online.length > 5 ? '<div class="m-dot" style="background:var(--surface2);color:var(--muted)">+'+(online.length-5)+'</div>' : '');
}
</script>
</body>
</html>
